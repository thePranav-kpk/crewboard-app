apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewboard-frontend
  labels:
    app: crewboard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crewboard-frontend
  template:
    metadata:
      labels:
        app: crewboard-frontend
    spec:
      containers:
        - name: frontend
          image: pranav1306/crewboard:frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: crewboard-frontend-service
spec:
  type: NodePort
  selector:
    app: crewboard-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
