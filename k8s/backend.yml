apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewboard-backend
  labels:
    app: crewboard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crewboard-backend
  template:
    metadata:
      labels:
        app: crewboard-backend
    spec:
      containers:
        - name: backend
          image: pranav1306/crewboard:backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: crewboard-config
            - secretRef:
                name: crewboard-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: crewboard-backend-service
spec:
  type: ClusterIP
  selector:
    app: crewboard-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
