apiVersion: v1
kind: Secret
metadata:
  name: crewboard-secrets
type: Opaque
stringData:
  JWT_SECRET: "your_jwt_secret_here"
  JWT_EXPIRES_IN: "7d"
  MONGODB_URI: "mongodb+srv://<user>:<password>@cluster0.xxx.mongodb.net/crewboard"
  REDIS_URL: "redis://default:<password>@<redis-endpoint>:6379"
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret_here"
  GOOGLE_REDIRECT_URI: "https://crewboard-api.onrender.com/auth/google/callback"
