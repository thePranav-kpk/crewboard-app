name: CI/CD Pipeline

# Triggers: Run automatically whenever code is pushed or PR to main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: Continuous Integration (Test & Build)
  test-and-build:
    name: Test & Build Code
    runs-on: ubuntu-latest

    steps:
      # Download your repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Test Backend Dependencies
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      # Test Frontend Build
      - name: Build Frontend with Vite
        run: |
          cd frontend
          npm ci
          npm run build

  # JOB 2: Continuous Deployment (Docker Hub)
  docker-publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build # Only run if Job 1 passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only on main push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: pranav1306/crewboard:backend

      # Build & Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: pranav1306/crewboard:frontend
